services:
  - type: web
    name: bongo-bazar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      # Free Postgres (Neon / Supabase). The value is NOT stored here:
      # set DATABASE_URL manually in the Render dashboard Environment
      # tab (e.g. postgresql://user:pass@host/db?sslmode=require).
      # With no DATABASE_URL the app falls back to local SQLite.
      # NOTE: the old persistent-disk block was removed on purpose -
      # disks are not supported on Render's Free plan, so the SQLite
      # file was ephemeral and data was lost on redeploy. Postgres
      # is now the only persistent store for live data.
      - key: DATABASE_URL
        sync: false
