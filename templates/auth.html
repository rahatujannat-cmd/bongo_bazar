{% extends 'base.html' %}

{% block title %}সাইন ইন ও একাউন্ট তৈরি - BongoBazaar{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    
    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden p-6 sm:p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white mx-auto mb-3 shadow-md">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-black text-slate-900">বঙ্গবাজারে স্বাগতম</h1>
            <p class="text-xs text-slate-500 mt-1">আপনার অ্যাকাউন্ট দিয়ে সহজে অর্ডার ও ট্র্যাক করুন</p>
        </div>

        <!-- Tabs (Login vs Register) -->
        <div class="flex rounded-2xl bg-slate-100 p-1 mb-6 text-xs font-bold">
            <button type="button" onclick="switchAuthTab('login')" id="tab-btn-login" class="flex-1 py-2 rounded-xl bg-white text-emerald-700 shadow-sm transition-all">
                লগইন (Sign In)
            </button>
            <button type="button" onclick="switchAuthTab('register')" id="tab-btn-register" class="flex-1 py-2 rounded-xl text-slate-600 transition-all">
                নতুন একাউন্ট (Register)
            </button>
        </div>

        <!-- 1-Click Demo Logins -->
        <div class="mb-6 p-3 bg-emerald-50 rounded-2xl border border-emerald-100 text-center">
            <span class="text-[11px] font-bold text-emerald-900 block mb-2">দ্রুত টেস্ট করার জন্য ১-ক্লিক ডেমো লগইন:</span>
            <div class="flex gap-2 justify-center">
                <button type="button" onclick="loginAsDemo('customer')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
                    👤 ডেমো ক্রেতা
                </button>
                <button type="button" onclick="loginAsDemo('admin')" class="px-3 py-1.5 bg-purple-700 hover:bg-purple-800 text-white rounded-xl text-xs font-bold shadow-sm transition-all">
                    👑 ডেমো অ্যাডমিন
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">ইমেইল অথবা মোবাইল নম্বর</label>
                <input type="text" id="login-identifier" required placeholder="customer@bongobazaar.com বা 01819000002" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="font-bold text-slate-700">পাসওয়ার্ড</label>
                    <button type="button" onclick="simulateForgotPw()" class="text-[11px] text-emerald-600 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</button>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition-all text-sm">
                লগইন করুন &rarr;
            </button>
        </form>

        <!-- Register Form -->
        <form id="form-register" onsubmit="handleRegisterSubmit(event)" class="hidden space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">পূর্ণ নাম</label>
                <input type="text" id="reg-name" required placeholder="যেমন: মারুফ আহমেদ" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">ইমেইল ঠিকানা</label>
                <input type="email" id="reg-email" required placeholder="name@email.com" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">মোবাইল নম্বর</label>
                <input type="tel" id="reg-phone" placeholder="01XXXXXXXXX" pattern="01[3-9][0-9]{8}" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 font-mono">
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md transition-all text-sm">
                একাউন্ট তৈরি করুন &rarr;
            </button>
        </form>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    function switchAuthTab(tab) {
        if (tab === 'login') {
            document.getElementById('form-login').classList.remove('hidden');
            document.getElementById('form-register').classList.add('hidden');
            document.getElementById('tab-btn-login').className = 'flex-1 py-2 rounded-xl bg-white text-emerald-700 shadow-sm transition-all';
            document.getElementById('tab-btn-register').className = 'flex-1 py-2 rounded-xl text-slate-600 transition-all';
        } else {
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-register').classList.remove('hidden');
            document.getElementById('tab-btn-register').className = 'flex-1 py-2 rounded-xl bg-white text-emerald-700 shadow-sm transition-all';
            document.getElementById('tab-btn-login').className = 'flex-1 py-2 rounded-xl text-slate-600 transition-all';
        }
    }

    function handleLoginSubmit(e) {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: identifier, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast('লগইন সফল!', data.message, 'success');
                setTimeout(() => {
                    if (data.user.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/account';
                    }
                }, 600);
            } else {
                showToast('লগইন ব্যর্থ', data.message, 'error');
            }
        });
    }

    function handleRegisterSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email, phone: phone, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                showToast('রেজিস্ট্রেশন সফল!', data.message, 'success');
                setTimeout(() => {
                    window.location.href = '/account';
                }, 600);
            } else {
                showToast('ত্রুটি', data.message, 'error');
            }
        });
    }

    function simulateForgotPw() {
        const email = prompt("পাসওয়ার্ড রিসেটের জন্য আপনার ইমেইল অথবা ফোন নম্বর দিন:");
        if (email) {
            showToast("ওটিপি পাঠানো হয়েছে", `${email} নম্বরে ৪ ডিজিটের পাসওয়ার্ড রিসেট ওটিপি পাঠানো হয়েছে।`, "info");
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const initial = "{{ initial_tab }}";
        if (initial === 'register') {
            switchAuthTab('register');
        }
    });
</script>
{% endblock %}
